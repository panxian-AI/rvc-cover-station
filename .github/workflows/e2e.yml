name: e2e

# 每次 push / PR 都跑全量回归（dashboard/run_e2e.py --strict）。
#
# 为什么检出到 stack/RVC-Data/RVCSVC，而不是仓库根：
#   回归里有 8 套要看「这台机器装了什么」——声线 pth、成品 mp3、面板解释器、
#   WebUI 源码。真实安装布局是 RVC-Data\{RVC-WebUI, RVCSVC\{dashboard,...}}，
#   而仓库里 RVC-WebUI 在 RVCSVC 内部，两种布局并不一样（e2e_perf 里写死
#   ../../RVC-WebUI，只在安装布局成立）。按安装布局检出，再让 ci_fixture.py
#   摆一份最小夹具，19 套就都能在 CI 上真跑，而不是靠「跳过」装绿。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # runner 的默认代码页不是 UTF-8，不设这两项中文汇总会直接编码报错
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: 按真实安装布局检出
        uses: actions/checkout@v4
        with:
          path: stack/RVC-Data/RVCSVC

      - name: 装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: stack/RVC-Data/RVCSVC/requirements.txt

      - name: 装面板依赖（全部锁死版本）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r stack/RVC-Data/RVCSVC/requirements.txt

      - name: 装 torch（CPU 版，造 pth 夹具用）
        run: python -m pip install torch==2.7.1

      - name: 造运行夹具（声线 / 成品 / 解释器 / WebUI）
        working-directory: stack/RVC-Data/RVCSVC/dashboard
        run: python ci_fixture.py

      - name: 全量回归
        working-directory: stack/RVC-Data/RVCSVC/dashboard
        # 用 cmd + chcp 936：安装器回归要跑 GBK 的 .bat（用户双击就是 cmd 环境），
        # runner 默认代码页是 1252，中文文件名会解析成乱码，e2e_ai_install 会假红。
        shell: cmd
        run: |
          chcp 936 >nul
          python run_e2e.py --strict --timeout 900

      - name: 留下回归日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-log
          path: stack/RVC-Data/RVCSVC/dashboard/logs/e2e_run-last.log
          if-no-files-found: ignore
